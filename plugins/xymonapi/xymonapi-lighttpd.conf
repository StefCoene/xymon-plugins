# The Xymon API, xymonapi(8), through lighttpd: for laptops and other
# machines, which must not reach port 1986 itself. It passes requests to the
# API's relay socket, @XYMONHOME@/tmp/xymonapi-relay/relay.sock
# (XYMONAPI_RELAY_SOCKET; lighttpd 1.4.36 or later), whether port 1986 speaks
# HTTPS or not -- lighttpd does not pass to an HTTPS server; a password is
# asked there as on the port.
# Include this file in the configuration that serves the Xymon pages, with
# mod_proxy enabled, in the HTTPS part where there is one.
#
# The API keeps checking the password itself when XYMONAPI_PASSWD is set,
# and lighttpd carries the Authorization header through.
$HTTP["url"] =~ "^/xymon/api/" {
    proxy.server = ( "" => ( ( "host" => "@XYMONHOME@/tmp/xymonapi-relay/relay.sock" ) ) )
}
