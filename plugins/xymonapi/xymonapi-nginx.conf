# The Xymon API, xymonapi(8), through nginx: for laptops and other machines,
# which must not reach port 1986 itself. It passes requests to the API's
# relay socket, @XYMONRUNDIR@/xymonapi/relay.sock
# (XYMONAPI_RELAY_SOCKET), whether port 1986 speaks HTTPS or not; a password
# is asked there as on the port. Include this file in the server block that
# serves the Xymon pages, the HTTPS one where there is one.
#
# The API keeps checking the password itself when XYMONAPI_PASSWD is set,
# and nginx carries the Authorization header through.
location /xymon/api/ {
    proxy_pass http://unix:@XYMONRUNDIR@/xymonapi/relay.sock:/xymon/api/;
}
